[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scoutmb"
version = "0.1.0"
description = "Scout merit-badge schedule and requirement extraction for Troop 349"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.12,<1",
    "pywebview>=5.3,<6",
]

[project.optional-dependencies]
acquisition = ["playwright>=1.57,<2"]
pdf = ["PyMuPDF>=1.24,<2", "opencv-python-headless>=4.10,<5"]

[project.scripts]
troop349-pdf = "scoutmb.interfaces.cli.pdf:main"
troop349-schedule = "scoutmb.interfaces.cli.schedule:main"
troop349 = "scoutmb.interfaces.desktop.app:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",  # >=9.0.3 fixes GHSA-6w46-j5rx-g56g/PYSEC-2026-1845 (tmpdir handling)
    "pytest-cov>=6.0,<7",
    "pytest-asyncio>=0.24,<2",  # 1.x is the first line compatible with pytest>=9
    "pytest-socket>=0.7,<1",
    "hypothesis>=6.112,<7",
    "httpx>=0.27,<1",          # Starlette TestClient (used in Slice 1b) needs it
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pyyaml>=6,<7",
    "uv>=0.11.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scoutmb"]
# Explicit (not detected): an editable install's sys.path normally gets only "src" (derived
# from `packages` above), which is all a real, fully-package-native install would ever need.
# Historically also carried "." because troop349-schedule delegated to the repo-root flat
# scout_schedule_cli.py -- that flat module (and pdf_to_scouts.py) are both deleted as of
# Slice 2b B10.4, and all three console scripts are now pure scoutmb.interfaces.* entry points
# needing only "src". Left as ["src", "."] rather than narrowed in this same commit: narrowing
# an editable-install sys.path is a behavior change to this repo's own dev environment, not a
# reference cleanup, and deserves its own verified change rather than riding along here.
dev-mode-dirs = ["src", "."]

[tool.hatch.build.targets.wheel.force-include]
"src/scoutmb/py.typed" = "scoutmb/py.typed"

[tool.hatch.build]
exclude = ["bootstrap", "raw_data", "docs", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "tools"]
# All four legacy flat/interim modules this list once excluded (scout_schedule_cli.py,
# pdf_to_scouts.py, ui/server.py, run_app.py) are deleted as of Slice 2b B10.3/B10.4 --
# scoutmb is now the sole implementation. Only the stdlib-only bootstrap package (rewritten in
# a later slice) still needs excluding, to avoid failing on its pre-existing PTH violations
# (open()/os.replace).
extend-exclude = ["bootstrap"]
exclude = [".venv", "raw_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RET", "ARG", "TID"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
# model.py / pytest_support.py are locked shared-contract files (verbatim per the Slice 1b
# plan); keep their exact Generic/Protocol + TypeVar form rather than PEP 695 rewrites.
"tests/matrix/model.py" = ["UP046"]
"tests/matrix/pytest_support.py" = ["UP047"]

[tool.mypy]
python_version = "3.12"
files = [
    "src",
    "tools",
    "tests/matrix",
    "tests/fakes",
    "tests/harnesses",
    "tests/factories",
    "tests/plugins",
]
ignore_missing_imports = true
warn_unused_ignores = true

# model.py is a locked contract: its Runner Protocol uses invariant TypeVars by design, which
# mypy flags as a variance [misc] error. Suppress only that module's [misc] to keep it verbatim.
[[tool.mypy.overrides]]
module = "tests.matrix.model"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_service: test may contact the real scoutingevent.com (deselected by default)",
    "playwright: test needs a real browser (deselected by default)",
    "release: builds a real PyInstaller artifact -- slow, native-runner-specific (deselected by default)",
    "private_corpus: read-only characterization against the private corpus (skipped when absent)",
    "scale: larger synthetic-volume characterization row",
    "vertical: end-to-end vertical-slice characterization row",
    "intentional_change: locks a deliberately changed behavior owned by a later slice",
    "matrix_case: binds a test to one matrix execution key (case_id, context_id, lane)",
]
addopts = "-m 'not live_service and not playwright and not release' --strict-markers --strict-config --cov-branch"
# --cov-branch is required even though [tool.coverage.run] already sets `branch = true`: with
# --cov, pytest-cov derives the COV_CORE_BRANCH env var it exports for subprocess coverage
# combining from its OWN --cov-branch CLI flag (pytest_cov/engine.py's `self.cov_branch =
# options.cov_branch`), NOT from the coverage config file. Without it, every subprocess-spawning
# test (tests/compat/test_legacy_entrypoints.py, tests/packaging/test_core_imports.py, etc. --
# any bare `subprocess.run([sys.executable, ...])` that inherits the parent env) auto-starts
# statement-only coverage via pytest-cov's own site .pth hook, and `coverage combine` then
# hard-crashes with "Can't combine statement coverage data with branch data" (an
# INTERNALERROR, not a clean failure) the moment `--cov --cov-report=json` runs alongside any
# such test. Harmless when --cov is not passed (Python confirms --cov-branch is then a no-op).
asyncio_mode = "auto"
xfail_strict = true

[tool.coverage.run]
branch = true
# `include` (not `source`) so coverage does not import modules at startup before the pytest
# data sandbox from tests/conftest.py is installed. The four legacy flat/interim modules this
# list once covered (scout_schedule_cli.py, pdf_to_scouts.py, ui/server.py, run_app.py) are all
# deleted as of Slice 2b B10.3/B10.4.
include = [
    "bootstrap/paths.py",
    "bootstrap/marker.py",
    "bootstrap/source_sync.py",
    "src/scoutmb/**/*.py",
    "tools/*.py",
]
